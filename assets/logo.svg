<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" role="img" aria-label="Elona's Toys logo">
  <defs>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- White circular badge background -->
  <circle cx="70" cy="70" r="50" fill="#ffffff" stroke="#f8fafc" stroke-width="3" filter="url(#badge-shadow)"/>

  <!-- Orange bear head -->
  <circle cx="70" cy="52" r="34" fill="#f59e0b" stroke="#374151" stroke-width="4"/>

  <!-- Ears -->
  <circle cx="42" cy="30" r="18" fill="#f59e0b" stroke="#374151" stroke-width="4"/>
  <circle cx="98" cy="30" r="18" fill="#f59e0b" stroke="#374151" stroke-width="4"/>

  <!-- Eyes -->
  <circle cx="58" cy="50" r="4" fill="#ffffff"/>
  <circle cx="82" cy="50" r="4" fill="#ffffff"/>

  <!-- Snout -->
  <ellipse cx="70" cy="60" rx="8" ry="6" fill="#ffffff"/>

  <!-- Tongue -->
  <ellipse cx="70" cy="72" rx="6" ry="4" fill="#ef4444"/>
</svg>
