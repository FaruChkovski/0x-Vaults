name: Bump vault version on push

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Prevent infinite loops: skip when this push was already a version bump
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore(release): bump version')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bump patch version and record patch details
        id: bump
        run: |
          python scripts/bump_version.py > /tmp/bumped_version.txt
          echo "version=$(cat /tmp/bumped_version.txt | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag
        run: |
          git config user.name "Hermes Agent"
          git config user.email "hermes@nousresearch.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add VERSION README.md
          git commit -m "chore(release): bump version to ${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin main --tags
        env:
          VERSION: ${{ steps.bump.outputs.version }}
