<main class="container py-48" id="productPage">
  <div style="max-width:900px; margin:0 auto;">
    <div id="productNotFound" class="card text-center" style="padding:48px;" hidden>
      <div style="font-size:3rem; margin-bottom:16px;">🧸</div>

      <a href="catalog.html" class="btn btn-primary">Browse Catalog</a>
    </div>
    <div id="productContent" hidden>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:32px; align-items:start;">
        <div class="product-image" style="width:100%; height:320px; border-radius:var(--radius); background:var(--color-border); display:flex; align-items:center; justify-content:center; font-size:5rem;">🧸</div>
        <div>
          <span class="product-badge" id="productAge"></span>
          <h1 id="productName" style="font-family:var(--font-heading); font-size:2.5rem; margin-bottom:8px;"></h1>
          <span class="product-stock" id="productStock"></span>
          <div class="product-price" style="font-size:1.75rem; margin:16px 0;" id="productPrice"></div>
          <p style="color:var(--color-text-muted); margin-bottom:24px;" id="productDesc"></p>
          <div style="display:flex; gap:12px; flex-wrap:wrap;">
            <button class="btn btn-accent" onclick="addToCartFromDetail()">🛒 Add to Cart</button>
            <a href="https://wa.me/96178702712" class="btn btn-primary" target="_blank">💬 WhatsApp Order</a>

</main>

<script src="app.js"></script>
<script>
// Product detail: load product by id from URL
async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id) {
    document.getElementById('productNotFound').hidden = false;
    return;
  }
  try {
    const res = await fetch('products.json');
    const data = await res.json();
    const p = data.products.find(prod => prod.id === id);
    if (!p) {
      document.getElementById('productNotFound').hidden = false;
      return;
    }
    renderProduct(p);
  } catch (e) {
    console.error('Failed to load product:', e);
    document.getElementById('productNotFound').hidden = false;
  }
}

function renderProduct(p) {
  const name = document.documentElement.lang === 'ar' && p.nameAr ? p.nameAr : p.name;
  const desc = document.documentElement.lang === 'ar' && p.descriptionAr ? p.descriptionAr : p.description;
  document.getElementById('productName').textContent = name;
  document.getElementById('productAge').textContent = p.ageBracket;
  document.getElementById('productStock').textContent = p.stock;
  document.getElementById('productStock').className = 'product-stock ' + p.stock.toLowerCase().replace(' ', '-');
  document.getElementById('productPrice').textContent = '$' + p.price;
  document.getElementById('productDesc').textContent = desc;
  document.title = name + ' — Elona\'s Toys';
  document.getElementById('productContent').hidden = false;
}

function addToCartFromDetail() {
  const params = new URLSearchParams(window.location.search);
  addToCart(params.get('id'));
}

document.addEventListener('DOMContentLoaded', () => {
  loadProduct();
});
</script>
</body>
</html>
