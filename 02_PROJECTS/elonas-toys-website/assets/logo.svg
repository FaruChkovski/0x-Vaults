<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80" role="img" aria-label="Elona's Toys">
  <defs>
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- White circular badge background -->
  <circle cx="44" cy="40" r="34" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" filter="url(#logo-shadow)"/>

  <!-- Teddy bear head -->
  <g transform="translate(44, 27)" filter="url(#logo-shadow)">
    <!-- Ears -->
    <circle cx="-8" cy="-9" r="6" fill="#f59e0b"/>
    <circle cx="8" cy="-9" r="6" fill="#f59e0b"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="11" fill="#f59e0b"/>
    <!-- Eyes -->
    <circle cx="-3" cy="-1" r="1.5" fill="#1f2937"/>
    <circle cx="3" cy="-1" r="1.5" fill="#1f2937"/>
    <!-- Snout / mouth -->
    <path d="M-2 3 Q0 5 2 3" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="0" cy="2" rx="1.5" ry="1" fill="#1f2937"/>
  </g>

  <!-- Multicolored "Elona's Toys" text -->
  <text x="100" y="52" font-family="'Permanent Marker', cursive" font-size="24" font-weight="700">
    <tspan dx="0"    fill="#dc2626">E</tspan>
    <tspan dx="16"  fill="#f59e0b">l</tspan>
    <tspan dx="14"  fill="#10b981">o</tspan>
    <tspan dx="18"  fill="#3b82f6">n</tspan>
    <tspan dx="18"  fill="#a855f7">a</tspan>
    <tspan dx="10"  fill="#ec4899">'</tspan>
    <tspan dx="16"  fill="#f59e0b">s</tspan>
    <tspan dx="22"  fill="#ffffff"> </tspan>
    <tspan dx="20"  fill="#dc2626">T</tspan>
    <tspan dx="20"  fill="#10b981">o</tspan>
    <tspan dx="20"  fill="#3b82f6">y</tspan>
    <tspan dx="18"  fill="#a855f7">s</tspan>
  </text>
</svg>
