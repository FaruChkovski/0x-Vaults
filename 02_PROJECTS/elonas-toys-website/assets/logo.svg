<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Elona's Toys logo">
  <defs>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <filter id="bear-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- White circular badge background -->
  <circle cx="60" cy="60" r="50" fill="#ffffff" stroke="#f8fafc" stroke-width="3" filter="url(#badge-shadow)"/>

  <!-- Teddy bear head (centered on badge) -->
  <g transform="translate(60, 48)" filter="url(#bear-shadow)">
    <!-- Ears -->
    <circle cx="-18" cy="-16" r="13" fill="#d97706"/>
    <circle cx="18" cy="-16" r="13" fill="#d97706"/>
    <!-- Inner ears -->
    <circle cx="-18" cy="-16" r="5.5" fill="#fbbf24"/>
    <circle cx="18" cy="-16" r="5.5" fill="#fbbf24"/>
    <!-- Head -->
    <circle cx="0" cy="2" r="20" fill="#f59e0b"/>
    <!-- Snout -->
    <ellipse cx="0" cy="8" rx="9" ry="6.5" fill="#fbbf24"/>
    <!-- Nose -->
    <circle cx="0" cy="3" r="3" fill="#1f2937"/>
    <!-- Mouth -->
    <path d="M-2.5 6.5 Q0 9.5 2.5 6.5" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="-7" cy="-2.5" r="2.5" fill="#111827"/>
    <circle cx="7" cy="-2.5" r="2.5" fill="#111827"/>
    <!-- Eye highlights -->
    <circle cx="-7.4" cy="-3" r="0.8" fill="#ffffff"/>
    <circle cx="7.4" cy="-3" r="0.8" fill="#ffffff"/>
    <!-- Cheeks -->
    <circle cx="-11" cy="8" r="2.5" fill="#fdba74" opacity="0.7"/>
    <circle cx="11" cy="8" r="2.5" fill="#fdba74" opacity="0.7"/>
  </g>
</svg>
