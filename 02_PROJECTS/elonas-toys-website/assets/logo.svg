<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="Elona's Toys logo">
  <defs>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- White circular badge background -->
  <circle cx="70" cy="70" r="50" fill="#ffffff" stroke="#f8fafc" stroke-width="3" filter="url(#badge-shadow)"/>

  <!-- Simple teddy bear head sitting ON TOP of the badge -->
  <g transform="translate(70, 40)">
    <!-- Ears -->
    <circle cx="-22" cy="-22" r="18" fill="#f59e0b"/>
    <circle cx="22" cy="-22" r="18" fill="#f59e0b"/>
    <!-- Inner ears -->
    <circle cx="-22" cy="-22" r="8" fill="#fbbf24"/>
    <circle cx="22" cy="-22" r="8" fill="#fbbf24"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="26" fill="#f59e0b"/>
    <!-- Snout -->
    <ellipse cx="0" cy="6" rx="12" ry="8" fill="#fbbf24"/>
    <!-- Simple eyes -->
    <circle cx="-8" cy="-4" r="2" fill="#1f2937"/>
    <circle cx="8" cy="-4" r="2" fill="#1f2937"/>
  </g>
</svg>
